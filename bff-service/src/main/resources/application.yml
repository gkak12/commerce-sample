spring:
  application:
    name: bff-service

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

  data:
    redis:
      host: localhost
      port: 6379
      password: 1234
      timeout: 2000ms
      connect-timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms

  datasource:
    url: jdbc:mysql://localhost:3306/bff_db?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20        # 최대 커넥션 수 (기본값 10)
      minimum-idle: 5              # 최소 유휴 커넥션 수
      connection-timeout: 3000     # 커넥션 획득 대기 시간 (3초, 초과 시 예외)
      idle-timeout: 300000         # 유휴 커넥션 유지 시간 (5분)
      max-lifetime: 1800000        # 커넥션 최대 수명 (30분, MySQL wait_timeout보다 짧게)
      leak-detection-threshold: 5000  # 커넥션 누수 감지 시간 (5초)

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: smtp.naver.com
    port: 465
    username: your-id@naver.com
    password: your-naver-password
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            trust: smtp.naver.com

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: YOUR_GOOGLE_CLIENT_ID
            client-secret: YOUR_GOOGLE_CLIENT_SECRET
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

          naver:
            client-id: YOUR_NAVER_CLIENT_ID
            client-secret: YOUR_NAVER_CLIENT_SECRET
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - name
              - email
            client-name: Naver

        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

jwt:
  secret: your-jwt-secret-key-must-be-at-least-32-characters-long
  access-token-expiration: 1800000    # 30분 (ms)
  refresh-token-expiration: 604800000 # 7일 (ms)
  rotation-threshold-days: 1          # Refresh Token 남은 유효기간이 1일 미만이면 Rotation

cookie:
  secure: false   # 로컬 개발환경 (HTTP). 운영 환경은 application-prod.yml에서 true로 설정

cors:
  allowed-origins:
    - http://localhost:3000   # 로컬 프론트 개발 서버

device:
  max-sessions: 5             # 사용자당 최대 동시 로그인 기기 수 (초과 시 가장 오래된 기기 자동 로그아웃)

server:
  port: 8080

grpc:
  client:
    order-service:
      address: static://localhost:9091
      negotiation-type: plaintext   # 로컬 환경 TLS 없음 (운영은 TLS 적용)
    point-service:
      address: static://localhost:9094
      negotiation-type: plaintext
    delivery-service:
      address: static://localhost:9093
      negotiation-type: plaintext
  timeout-ms: 3000                  # gRPC 호출 타임아웃 (3초)

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics, circuitbreakers
  health:
    circuitbreakers:
      enabled: true   # /actuator/health 에서 서킷 상태 확인 가능
  metrics:
    tags:
      application: ${spring.application.name}

cache:
  ttl:
    order-list-seconds: 30    # 주문 목록 캐시 TTL (주문/상태 변경이 잦아 짧게)
    order-detail-seconds: 10  # 주문 상세 캐시 TTL (배송 상태 실시간성 중요)
    point-seconds: 60         # 포인트 잔액 캐시 TTL (결제 시점에만 변경)
  lock:
    ttl-seconds: 3            # Mutex Lock TTL (gRPC 타임아웃과 동일하게 설정)
    wait-ms: 50               # 락 획득 실패 시 재조회 대기 시간

rate-limit:
  order-per-minute: 10        # 주문 생성/취소 (어뷰징 방지)
  auth-login-per-minute: 10   # 로그인 (브루트포스 방지, IP 기준)
  auth-signup-per-minute: 5   # 회원가입 (스팸 방지, IP 기준)
  default-per-minute: 60      # 마이페이지 조회 등 일반 API

stock:
  snapshot:
    interval-ms: 30000   # Redis → DB 스냅샷 주기 (기본 30초)

resilience4j:
  circuitbreaker:
    instances:
      redis:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
      order-service:
        sliding-window-size: 10               # 최근 10번의 호출로 상태 판단
        failure-rate-threshold: 50            # 실패율 50% 이상이면 서킷 오픈
        slow-call-duration-threshold: 3s      # 3초 이상이면 느린 호출로 간주
        slow-call-rate-threshold: 50          # 느린 호출 50% 이상이면 서킷 오픈
        wait-duration-in-open-state: 10s      # 서킷 오픈 후 10초 대기 후 Half-Open
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
      point-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
      delivery-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true

  retry:
    instances:
      order-service:
        max-attempts: 3                       # 최초 1번 + 재시도 2번
        wait-duration: 500ms                  # 재시도 간격 500ms
        enable-exponential-backoff: true      # 재시도마다 대기시간 증가 (500ms → 1s → 2s)
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - io.grpc.StatusRuntimeException    # gRPC 호출 실패 시 재시도
      point-service:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - io.grpc.StatusRuntimeException
      delivery-service:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - io.grpc.StatusRuntimeException
      redis:
        max-attempts: 2                       # 최초 1번 + 재시도 1번 (재고 작업은 빠르게 판단)
        wait-duration: 200ms
        retry-exceptions:
          - org.springframework.data.redis.RedisConnectionFailureException
          - io.lettuce.core.RedisConnectionException

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] [traceId=%X{traceId:-none}] %-5level %logger{36} - %msg%n"
  level:
    com.commerce.bff: DEBUG
