spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: your-email@gmail.com    # Gmail 주소로 변경
    password: your-app-password       # Google 계정 → 보안 → 앱 비밀번호 (16자리)
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
